name: watchdog
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check out the status branch (create it on first run)
        run: |
          if git ls-remote --exit-code --heads origin status >/dev/null; then
            git clone --branch status --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status-out
          else
            mkdir status-out && cd status-out && git init -q -b status
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
      - name: Tick
        env:
          READ_KEY: ${{ secrets.READ_KEY }}
          WAKE_URL: ${{ secrets.WAKE_URL }}
          WAKE_KEY: ${{ secrets.WAKE_KEY }}
        run: python3 watchdog.py --out status-out
      - name: Publish status
        run: |
          cd status-out
          tail -n 300 ticks.jsonl > t && mv t ticks.jsonl
          git config user.name watchdog && git config user.email watchdog@users.noreply.github.com
          git add -A && git commit -q -m "tick" && git push -q origin status
